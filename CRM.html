<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#e3e7ef;--brand:#2456d6;--brand2:#e8eefc;--ok:#1a9a5b;--warn:#d98a00;--bad:#d03a3a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:215px;background:#14224a;color:#cfd8f5;padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{background:#fff;border-radius:10px;padding:8px 10px;margin:0 2px 6px}.logo img{width:100%;display:block}
nav .app{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9fb0e6;margin:0 8px 14px;text-align:center}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;margin-left:6px}
a.btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid #cfd5e3;text-decoration:none;color:var(--ink);background:#fff}
nav a{display:block;padding:9px 12px;border-radius:8px;color:#cfd8f5;cursor:pointer;margin-bottom:3px;text-decoration:none}
nav a:hover{background:#1f3270}nav a.on{background:var(--brand);color:#fff}
nav .sp{flex:1}nav small{color:#8f9bc7;padding:0 8px}
main{flex:1;padding:22px 26px;min-width:0}
h2{margin:0 0 16px;font-size:21px}
h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.kpi b{display:block;font-size:26px;margin-top:2px}.kpi span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.two{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;color:var(--mute);letter-spacing:.4px;background:#fafbfd;position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f6f8fd}
.tw{overflow:auto;max-height:520px}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid #cfd5e3;border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.f{flex:1;min-width:170px}
button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--brand);color:#fff}
button.g{background:#fff;color:var(--ink);border:1px solid #cfd5e3}
button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:12px}
.bar{height:20px;border-radius:5px;background:var(--brand2);position:relative;margin:4px 0}
.bar i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.bar span{position:absolute;left:8px;top:1px;font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#eef1f7;white-space:nowrap}
.pill.won{background:#dcf5e7;color:#0f7a45}.pill.lost{background:#fbe0e0;color:#a52929}
.pill.prog{background:#fff0d1;color:#8a5a00}.pill.del{background:#dcf5e7;color:#0f7a45}.pill.hold{background:#e9e4fb;color:#4b3aa5}.pill.new{background:#e8eefc;color:#2456d6}
.overlay{position:fixed;inset:0;background:rgba(15,22,45,.55);display:flex;justify-content:center;align-items:flex-start;padding:30px 14px;overflow:auto;z-index:9}
.modal{background:#fff;border-radius:14px;width:min(960px,100%);padding:20px 22px}
.modal.sm{width:min(520px,100%)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;color:var(--mute);font-size:22px;padding:0 6px}
.donut{width:140px;height:140px;border-radius:50%;flex-shrink:0;position:relative}
.donut:after{content:"";position:absolute;inset:28px;background:#fff;border-radius:50%}
.leg div{margin:4px 0}.leg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px}
.act{border-left:3px solid var(--brand);padding:4px 10px;margin:8px 0;background:#fafbfd}
.act small{color:var(--mute)}
.mute{color:var(--mute)}.right{margin-left:auto}
.empty{padding:26px;text-align:center;color:var(--mute)}
.late{color:var(--bad);font-weight:600}
</style>

<script>
/* ---------- Data layer ---------- */
const KEY='bd_crm_v1';
const STAGES=['New','Contacted','Qualified','Proposal Sent','Negotiation','Converted','Lost'];
const ACTIVE=['New','Contacted','Qualified','Proposal Sent','Negotiation'];
const ACT_TYPES=['Call','Email','WhatsApp','Meeting','Note'];
const RSTAT=['Not Started','In Progress','On Hold','Delivered'];
const SOURCES=['Cold Call','Referral','Website','LinkedIn','Exhibition','Existing Client','Other'];
const ROLES=['BD Executive','Operations','Manager'];
let db=load(), view='dash', filt={leadQ:'',leadStage:'',leadOwner:'',leadTeam:'',custQ:'',opsStat:'',opsOwner:'',opsQ:'',dashTeam:'',dashFrom:'',dashTo:'',bStat:'',bSvc:'',fuTeam:'',fuOwner:''};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.leads){d.cands=d.cands||[];d.reqs=d.reqs||[];d.acts=d.acts||[];d.seq=d.seq||{cust:0};return d}}catch(e){}
  return {users:[],teams:['Team A','Team B','Operations'],leads:[],acts:[],reqs:[],cands:[],seq:{cust:0}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save: '+e.message)}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const fmtD=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
const fmtDT=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const user=id=>db.users.find(u=>u.id===id);
const uname=id=>(user(id)||{}).name||'—';
const teamOf=id=>(user(id)||{}).team||'—';
const lead=id=>db.leads.find(l=>l.id===id);
const opts=(arr,sel,blank)=>(blank!==undefined?`<option value="">${blank}</option>`:'')+arr.map(a=>{const v=Array.isArray(a)?a[0]:a,t=Array.isArray(a)?a[1]:a;return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`}).join('');
const userOpts=(sel,blank,role)=>opts(db.users.filter(u=>role==='BD'?u.role!=='Operations':role==='OPS'?u.role==='Operations':true).map(u=>[u.id,`${u.name} (${u.team})`]),sel,blank);
const pct=(a,b)=>b?Math.round(a*1000/b)/10:0;
const callsOf=(id,t)=>db.acts.filter(a=>a.leadId===id&&a.type===t).length;
const isCust=l=>l.stage==='Converted';

/* ---------- Navigation ---------- */
function go(v){view=v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));render()}
function render(){const m={dash:vDash,follow:vFollow,leads:vLeads,cust:vCust,ops:vOps,bill:vBill,team:vTeam,set:vSet};document.getElementById('app').innerHTML=fuBanner()+m[view]();updFU()}
function setF(k,v){filt[k]=v;render();const el=document.querySelector(`[data-f="${k}"]`);if(el&&el.tagName==='INPUT'){el.focus();el.setSelectionRange(v.length,v.length)}}
function modal(html,sm){document.getElementById('modal').innerHTML=`<div class="overlay" onmousedown="if(event.target===this)closeM()"><div class="modal ${sm?'sm':''}">${html}</div></div>`}
function closeM(){document.getElementById('modal').innerHTML=''}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

/* ---------- Dashboard ---------- */
function inRange(dt){if(filt.dashFrom&&dt<filt.dashFrom)return false;if(filt.dashTo&&dt>filt.dashTo+'T99')return false;return true}
function vDash(){
  const team=filt.dashTeam;
  const L=db.leads.filter(l=>(!team||teamOf(l.owner)===team)&&inRange(l.createdAt||''));
  const ids=new Set(L.map(l=>l.id));
  const R=db.reqs.filter(r=>ids.has(r.leadId));
  const A=db.acts.filter(a=>ids.has(a.leadId));
  const won=L.filter(isCust).length, lost=L.filter(l=>l.stage==='Lost').length, act=L.filter(l=>ACTIVE.includes(l.stage)).length;
  const closed=won+lost;
  const openR=R.filter(r=>r.status!=='Delivered'), late=openR.filter(r=>r.due&&r.due<today());
  const FB=fuBuckets(team,'');const bVal=R.filter(billed).reduce((a,r)=>a+(+r.charge||0),0),bCost=R.filter(billed).reduce((a,r)=>a+(+r.cost||0),0);const rset=new Set(R.map(r=>r.id)),CD=db.cands.filter(c=>rset.has(c.reqId));
  const maxS=Math.max(1,...STAGES.map(s=>L.filter(l=>l.stage===s).length));
  const funnel=STAGES.map(s=>{const n=L.filter(l=>l.stage===s).length;return `<div class="row" style="gap:8px;flex-wrap:nowrap"><div style="width:110px">${s}</div><div class="bar" style="flex:1"><i style="width:${n/maxS*100}%;${s==='Lost'?'background:var(--bad)':s==='Converted'?'background:var(--ok)':''}"></i><span>${n}</span></div></div>`}).join('');
  const execs=db.users.filter(u=>u.role!=='Operations'&&(!team||u.team===team));
  const execRow=u=>{const ls=L.filter(l=>l.owner===u.id), w=db.leads.filter(l=>isCust(l)&&ids.has(l.id)&&(l.convertedBy||l.owner)===u.id).length, lo=ls.filter(l=>l.stage==='Lost').length;
    const ac=A.filter(a=>a.by===u.id);const c=ac.filter(a=>a.type==='Call').length,e=ac.filter(a=>a.type==='Email').length,wa=ac.filter(a=>a.type==='WhatsApp').length,mt=ac.filter(a=>a.type==='Meeting').length;
    return {u,leads:ls.length,active:ls.filter(l=>ACTIVE.includes(l.stage)).length,won:w,lost:lo,c,e,wa,mt,conv:pct(w,ls.length)}};
  const ER=execs.map(execRow);
  const teamsList=db.teams.filter(t=>!team||t===team);
  const TR=teamsList.map(t=>{const rows=ER.filter(r=>r.u.team===t);const sum=k=>rows.reduce((a,r)=>a+r[k],0);return {t,n:rows.length,leads:sum('leads'),active:sum('active'),won:sum('won'),lost:sum('lost'),c:sum('c'),e:sum('e'),conv:pct(sum('won'),sum('leads'))}}).filter(r=>r.n>0);
  const stCount=RSTAT.map(s=>R.filter(r=>r.status===s).length), stCol=['#9aa4bd','#e0a100','#7b61d6','#1a9a5b'];
  let acc=0;const tot=R.length||1;
  const grad=R.length?stCount.map((n,i)=>{const a=acc/tot*100;acc+=n;return `${stCol[i]} ${a}% ${acc/tot*100}%`}).join(','):'#e3e7ef 0 100%';
  // customers waiting
  const waiting=db.leads.filter(l=>isCust(l)&&ids.has(l.id)).map(l=>{const rs=db.reqs.filter(r=>r.leadId===l.id),p=rs.filter(r=>r.status!=='Delivered');return {l,rs,p,due:p.map(r=>r.due).filter(Boolean).sort()[0]||''}}).filter(x=>x.p.length).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
  const recent=A.slice().sort((a,b)=>b.date<a.date?-1:1).slice(0,8);
  return `<div class="hd"><h2>Dashboard</h2><div class="row">
    <div><label>Team</label><select onchange="setF('dashTeam',this.value)">${opts(bdTeams(),filt.dashTeam,'All teams')}</select></div>
    <div><label>Lead created from</label><input type="date" value="${filt.dashFrom}" onchange="setF('dashFrom',this.value)"></div>
    <div><label>to</label><input type="date" value="${filt.dashTo}" onchange="setF('dashTo',this.value)"></div></div></div>
  <div class="grid kpis">
    <div class="kpi"><span>Total leads</span><b>${L.length}</b></div>
    <div class="kpi"><span>In pipeline</span><b>${act}</b></div>
    <div class="kpi"><span>Customers</span><b style="color:var(--ok)">${won}</b></div>
    <div class="kpi"><span>Conversion %</span><b>${pct(won,L.length)}%</b></div>
    <div class="kpi"><span>Win rate (closed)</span><b>${pct(won,closed)}%</b></div>
    <div class="kpi"><span>Open requirements</span><b>${openR.length}</b></div>
    <div class="kpi"><span>Overdue deliveries</span><b style="color:${late.length?'var(--bad)':'inherit'}">${late.length}</b></div>
    <div class="kpi"><span>Calls / Emails</span><b>${A.filter(a=>a.type==='Call').length} / ${A.filter(a=>a.type==='Email').length}</b></div>
    <div class="kpi"><span>Requirements billed / pending</span><b>${R.filter(billed).length} / ${R.filter(r=>!billed(r)).length}</b></div>
    <div class="kpi"><span>Billed value</span><b>${inr(bVal)}</b></div>
    <div class="kpi"><span>Follow-ups overdue</span><b style="color:${FB.overdue.length?'var(--bad)':'inherit'}">${FB.overdue.length}</b></div>
    <div class="kpi"><span>Follow-ups due today</span><b>${FB.today.length}</b></div>
    <div class="kpi"><span>Net P&amp;L (billed − cost)</span><b style="color:${bVal-bCost<0?'var(--bad)':'inherit'}">${inr(bVal-bCost)}</b></div>
  </div>
  <div class="grid two">
   <div class="card"><h3>Lead funnel</h3>${funnel}</div>
   <div class="card"><h3>Delivery status of client requirements</h3><div class="row" style="flex-wrap:nowrap;gap:22px"><div class="donut" style="background:conic-gradient(${grad})"></div><div class="leg">${RSTAT.map((s,i)=>`<div><b style="background:${stCol[i]}"></b>${s}: <strong>${stCount[i]}</strong></div>`).join('')}<div class="mute">Total: ${R.length}</div></div></div></div>
  </div>
  <div class="card"><h3>Candidate profiles pipeline</h3><div class="row"><span class="pill">Total profiles: <b>${CD.length}</b></span><span class="pill prog">Submitted to client: <b>${CD.filter(c=>c.status!=='Not Submitted').length}</b></span><span class="pill hold">In interview: <b>${CD.filter(c=>c.status==='Interview').length}</b></span><span class="pill del">Onboarded: <b>${CD.filter(c=>c.status==='Onboarded').length}</b></span><span class="pill lost">Rejected: <b>${CD.filter(c=>c.status==='Rejected').length}</b></span></div></div>
  <div class="card"><h3>Team-wise performance</h3><div class="tw"><table><tr><th>Team</th><th>Members</th><th>Leads</th><th>In pipeline</th><th>Converted</th><th>Lost</th><th>Calls</th><th>Emails</th><th>Conversion %</th></tr>
   ${TR.map(r=>`<tr><td><b>${esc(r.t)}</b></td><td>${r.n}</td><td>${r.leads}</td><td>${r.active}</td><td>${r.won}</td><td>${r.lost}</td><td>${r.c}</td><td>${r.e}</td><td><b>${r.conv}%</b></td></tr>`).join('')||'<tr><td colspan=9 class="empty">No teams</td></tr>'}</table></div></div>
  <div class="card"><h3>Executive-wise performance</h3><div class="tw"><table><tr><th>Executive</th><th>Team</th><th>Leads</th><th>In pipeline</th><th>Converted</th><th>Lost</th><th>Calls</th><th>Emails</th><th>WhatsApp</th><th>Meetings</th><th>Conversion %</th></tr>
   ${ER.map(r=>`<tr><td><b>${esc(r.u.name)}</b></td><td>${esc(r.u.team)}</td><td>${r.leads}</td><td>${r.active}</td><td>${r.won}</td><td>${r.lost}</td><td>${r.c}</td><td>${r.e}</td><td>${r.wa}</td><td>${r.mt}</td><td><b>${r.conv}%</b></td></tr>`).join('')||'<tr><td colspan=11 class="empty">Add executives in “Teams &amp; Executives”.</td></tr>'}</table></div></div>
  <div class="card"><h3>Customer-wise: requirements awaiting delivery</h3><div class="tw"><table><tr><th>Customer ID</th><th>Company</th><th>Service</th><th>BD Executive</th><th>Pending</th><th>Delivered</th><th>Earliest due</th><th>Pending requirements</th></tr>
   ${waiting.map(x=>`<tr class="click" onclick="openLead('${x.l.id}')"><td>${esc(x.l.customerId)}</td><td><b>${esc(x.l.company)}</b></td><td>${esc(x.l.onboardedService)}</td><td>${esc(uname(x.l.convertedBy||x.l.owner))}</td><td>${x.p.length}</td><td>${x.rs.length-x.p.length}</td><td class="${x.due&&x.due<today()?'late':''}">${fmtD(x.due)}</td><td>${x.p.map(r=>esc(r.title)+' <span class="pill '+rc(r.status)+'">'+r.status+'</span>').join('<br>')}</td></tr>`).join('')||'<tr><td colspan=8 class="empty">No customers are waiting on delivery 🎉</td></tr>'}</table></div></div>
  <div class="card"><h3>Recent discussions</h3>${recent.map(a=>`<div class="act"><b>${a.type}</b> · ${esc((lead(a.leadId)||{}).company)} · <small>${fmtDT(a.date)} · ${esc(uname(a.by))}</small><div>${esc(a.notes)}</div></div>`).join('')||'<div class="empty">No discussions logged yet.</div>'}</div>`;
}
const rc=s=>({'Not Started':'new','In Progress':'prog','On Hold':'hold','Delivered':'del'}[s]);
const sc=s=>s==='Converted'?'won':s==='Lost'?'lost':s==='New'?'new':'prog';

/* ---------- Leads ---------- */
function vLeads(){
  const q=filt.leadQ.toLowerCase();
  const L=db.leads.filter(l=>(!filt.leadStage||l.stage===filt.leadStage)&&(!filt.leadOwner||l.owner===filt.leadOwner)&&(!filt.leadTeam||teamOf(l.owner)===filt.leadTeam)&&(!q||[l.company,l.contact,l.email,l.mobile,l.location,l.customerId].join(' ').toLowerCase().includes(q)));
  return `<div class="hd"><h2>Leads <span class="mute" style="font-size:14px">(${L.length})</span></h2><div class="row"><button class="g" onclick="exportLeads()">⬇ Export CSV</button><button onclick="editLead()">＋ New Lead</button></div></div>
  <div class="card row">
    <div class="f"><label>Search</label><input data-f="leadQ" value="${esc(filt.leadQ)}" placeholder="Company, contact, email, mobile…" oninput="setF('leadQ',this.value)"></div>
    <div class="f"><label>Stage</label><select onchange="setF('leadStage',this.value)">${opts(STAGES,filt.leadStage,'All stages')}</select></div>
    <div class="f"><label>Team</label><select onchange="setF('leadTeam',this.value)">${opts(bdTeams(),filt.leadTeam,'All teams')}</select></div>
    <div class="f"><label>Executive</label><select onchange="setF('leadOwner',this.value)">${userOpts(filt.leadOwner,'All executives','BD')}</select></div></div>
  <div class="card tw" style="padding:0"><table><tr><th>Company</th><th>Location</th><th>Contact</th><th>Mobile</th><th>Stage</th><th>Executive</th><th>Calls</th><th>Emails</th><th>Next follow-up</th><th>Customer ID</th></tr>
  ${L.map(l=>`<tr class="click" onclick="openLead('${l.id}')"><td><b>${esc(l.company)}</b><div class="mute">${esc(l.service)}</div></td><td>${esc(l.location)}</td><td>${esc(l.contact)}<div class="mute">${esc(l.email)}</div></td><td>${esc(l.mobile)}</td><td><span class="pill ${sc(l.stage)}">${l.stage}</span></td><td>${esc(uname(l.owner))}</td><td>${callsOf(l.id,'Call')}</td><td>${callsOf(l.id,'Email')}</td><td class="${l.nextFollowUp&&l.nextFollowUp<today()&&l.stage!=='Lost'?'late':''}">${l.stage==='Lost'?'':fmtD(l.nextFollowUp)||'<span class="mute">not set</span>'}</td><td>${esc(l.customerId||'')}</td></tr>`).join('')||'<tr><td colspan=10 class="empty">No leads yet. Click “＋ New Lead”.</td></tr>'}</table></div>`;
}
function editLead(id){
  if(!db.users.length){alert('Please add at least one executive first (Teams & Executives).');return go('team')}
  const l=id?lead(id):{stage:'New',owner:db.users.find(u=>u.role!=='Operations')?.id||db.users[0].id,source:'Cold Call',nextFollowUp:addDays(1)};
  modal(`<div class="hd"><h3>${id?'Edit':'New'} lead</h3><button class="x" onclick="closeM()">×</button></div>${leadForm(l)}
  <div class="row" style="margin-top:12px"><button onclick="saveLead('${id||''}')">Save lead</button><button class="g" onclick="closeM()">Cancel</button></div>`);
}
function leadForm(l){const F=(id,lab,v,t)=>`<div class="f"><label>${lab}</label><input id="${id}" type="${t||'text'}" value="${esc(v)}"></div>`;
  return `<div class="row">${F('lc','Company name *',l.company)}${F('ll','Location',l.location)}${F('lw','Website',l.website)}</div>
  <div class="row" style="margin-top:8px">${F('ln','Contact person name',l.contact)}${F('le','Email ID',l.email,'email')}${F('lm','Mobile no',l.mobile)}</div>
  <div class="row" style="margin-top:8px">${F('lwa','WhatsApp no',l.whatsapp)}${F('lp','Phone no (landline)',l.phone)}
   <div class="f"><label>Lead source</label><select id="lsrc">${opts(SOURCES,l.source)}</select></div></div>
  <div class="row" style="margin-top:8px">${F('lsv','Service interested in',l.service)}
   <div class="f"><label>BD Executive (owner)</label><select id="lo">${userOpts(l.owner,undefined,'BD')}</select></div>
   <div class="f"><label>Stage</label><select id="ls" ${l.stage==='Converted'&&l.customerId?'disabled':''}>${opts(STAGES.filter(s=>s!=='Converted'||l.customerId),l.stage)}</select></div></div>
  <div class="row" style="margin-top:8px">${F('lfu','Next follow-up date',l.nextFollowUp,'date')}${F('lfn','Follow-up purpose / note',l.followUpNote)}</div>`}
function readLead(l){l.company=val('lc');l.location=val('ll');l.website=val('lw');l.contact=val('ln');l.email=val('le');l.mobile=val('lm');l.whatsapp=val('lwa');l.phone=val('lp');l.source=val('lsrc');l.service=val('lsv');l.owner=val('lo');const ofu=l.nextFollowUp;l.nextFollowUp=val('lfu');l.followUpNote=val('lfn');if(l.nextFollowUp!==ofu)l.remindedOn='';if(!document.getElementById('ls').disabled)l.stage=val('ls')}
function saveLead(id){
  if(!val('lc'))return alert('Company name is required');
  let l=id?lead(id):{id:uid(),createdAt:new Date().toISOString()};
  readLead(l);
  if(!id)db.leads.push(l);
  save();closeM();render();
  if(l.stage==='Converted'&&!l.customerId){l.stage='Contacted';save();convertM(l.id)}
}
function openLead(id){
  const l=lead(id);if(!l)return;
  const acts=db.acts.filter(a=>a.leadId===id).sort((a,b)=>a.date<b.date?1:-1);
  const reqs=db.reqs.filter(r=>r.leadId===id);
  const cnt=ACT_TYPES.slice(0,4).map(t=>`<span class="pill">${t}s: <b>${callsOf(id,t)}</b></span>`).join(' ');
  modal(`<div class="hd"><div><h3 style="font-size:18px;margin:0">${esc(l.company)} ${l.customerId?`<span class="pill won">${esc(l.customerId)}</span>`:''}</h3>
    <div class="mute">Created ${fmtD(l.createdAt)} · Executive: ${esc(uname(l.owner))} (${esc(teamOf(l.owner))})${l.customerId?` · Converted by ${esc(uname(l.convertedBy))} on ${fmtD(l.convertedAt)} · Service: <b>${esc(l.onboardedService)}</b>`:''}</div></div><button class="x" onclick="closeM()">×</button></div>
  <div class="row" style="margin-bottom:10px">${cnt}
   <div class="right row">${l.email?`<a class="btn" href="mailto:${esc(l.email)}">✉ Email contact</a>`:''}${l.whatsapp?`<a class="btn" target="_blank" href="https://wa.me/${(String(l.whatsapp).replace(/\D/g,'').length===10?'91':'')+String(l.whatsapp).replace(/\D/g,'')}">WhatsApp</a>`:''}${!isCust(l)&&l.stage!=='Lost'?`<button onclick="convertM('${id}')" style="background:var(--ok)">✔ Convert to customer</button><button class="g" onclick="lostM('${id}')">Mark lost</button>`:''}
   ${l.stage==='Lost'?`<button class="g" onclick="reopen('${id}')">Reopen lead</button>`:''}</div></div>
  <div class="card">${leadForm(l)}<div class="row" style="margin-top:10px"><button onclick="saveLeadInline('${id}')">Save changes</button><button class="d s" onclick="delLead('${id}')">Delete lead</button></div></div>
  <div class="card"><h3>Discussions &amp; follow-ups</h3>
   <div class="row"><div class="f" style="max-width:150px"><label>Type</label><select id="at">${opts(ACT_TYPES)}</select></div>
    <div class="f" style="max-width:210px"><label>Date &amp; time</label><input id="ad" type="datetime-local" value="${nowLocal()}"></div>
    <div class="f" style="max-width:220px"><label>By</label><select id="ab">${userOpts(l.owner,undefined,'BD')}</select></div>
    ${l.stage!=='Lost'?`<div class="f" style="max-width:190px"><label>Next follow-up on</label><input id="afu" type="date" value="${addDays(3)}"></div><div class="f"><label>Follow-up purpose</label><input id="afn" placeholder="e.g. share proposal"></div>`:''}</div>
   <div style="margin:8px 0"><label>What was discussed *</label><textarea id="an" placeholder="Summary of the call / email / meeting, next steps…"></textarea></div>
   <button onclick="addAct('${id}')">Add discussion</button>
   ${acts.map(a=>`<div class="act"><b>${a.type}</b> <small>· ${fmtDT(a.date)} · ${esc(uname(a.by))}</small> <button class="g s right" style="float:right" onclick="delAct('${a.id}','${id}')">✕</button><div>${esc(a.notes).replace(/\n/g,'<br>')}</div></div>`).join('')||'<div class="mute" style="margin-top:8px">No discussions logged yet.</div>'}</div>
  ${isCust(l)?`<div class="card"><div class="hd"><h3>Client requirements &amp; delivery status</h3><button class="s" onclick="editReq('','${id}')">＋ Add requirement</button></div>
   ${reqs.length?`<table><tr><th>Requirement</th><th>Shared on</th><th>Due</th><th>Ops owner</th><th>Status</th><th></th></tr>${reqs.map(r=>`<tr><td><b>${esc(r.title)}</b><div class="mute">${esc(r.desc)}</div>${r.remarks?`<div class="mute">Ops: ${esc(r.remarks)}</div>`:''}</td><td>${fmtD(r.shared)}</td><td class="${r.status!=='Delivered'&&r.due&&r.due<today()?'late':''}">${fmtD(r.due)}</td><td>${esc(uname(r.opsOwner))}</td><td><span class="pill ${rc(r.status)}">${r.status}</span></td><td><button class="g s" onclick="editReq('${r.id}','${id}')">Edit</button> <button class="g s" onclick="candM('${r.id}')">Candidates (${candsOf(r.id).length})</button></td></tr>`).join('')}</table>`:'<div class="mute">No requirements recorded yet.</div>'}</div>`:''}`);
}
function saveLeadInline(id){if(!val('lc'))return alert('Company name is required');const l=lead(id);const old=l.stage;readLead(l);save();
  if(l.stage==='Converted'&&!l.customerId){l.stage=old;save();return convertM(id)}render();openLead(id)}
function delLead(id){if(!confirm('Delete this lead and all its discussions & requirements?'))return;const rids=db.reqs.filter(r=>r.leadId===id).map(r=>r.id);db.cands=db.cands.filter(c=>!rids.includes(c.reqId));db.leads=db.leads.filter(l=>l.id!==id);db.acts=db.acts.filter(a=>a.leadId!==id);db.reqs=db.reqs.filter(r=>r.leadId!==id);save();closeM();render()}
function addAct(id){const n=val('an');if(!n)return alert('Please enter what was discussed');
  db.acts.push({id:uid(),leadId:id,type:val('at'),date:val('ad')||nowLocal(),by:val('ab'),notes:n});
  const l=lead(id);if(l.stage==='New'&&CONTACT_TYPES.includes(val('at')))l.stage='Contacted';
  const fu=val('afu');if(fu){l.nextFollowUp=fu;l.followUpNote=val('afn');l.remindedOn=''}else if(CONTACT_TYPES.includes(val('at'))&&l.nextFollowUp&&l.nextFollowUp<=today()){l.nextFollowUp='';l.followUpNote=''}
  save();render();openLead(id)}
function delAct(a,id){if(!confirm('Delete this entry?'))return;db.acts=db.acts.filter(x=>x.id!==a);save();render();openLead(id)}
function lostM(id){modal(`<div class="hd"><h3>Mark lead as lost</h3><button class="x" onclick="closeM()">×</button></div><label>Reason</label><textarea id="lr"></textarea><div class="row" style="margin-top:12px"><button class="d" onclick="doLost('${id}')">Mark lost</button><button class="g" onclick="openLead('${id}')">Back</button></div>`,1)}
function doLost(id){const l=lead(id);l.stage='Lost';l.nextFollowUp='';l.lostReason=val('lr');if(l.lostReason)db.acts.push({id:uid(),leadId:id,type:'Note',date:nowLocal(),by:l.owner,notes:'Marked lost: '+l.lostReason});save();render();openLead(id)}
function reopen(id){lead(id).stage='Contacted';save();render();openLead(id)}
function convertM(id){const l=lead(id);
  modal(`<div class="hd"><h3>Convert “${esc(l.company)}” to customer</h3><button class="x" onclick="closeM()">×</button></div>
  <div class="mute" style="margin-bottom:10px">A unique Customer ID will be generated automatically.</div>
  <label>Service customer is onboarded for *</label><input id="cs" value="${esc(l.service)}"><div style="height:8px"></div>
  <label>Converted by</label><select id="cb">${userOpts(l.owner,undefined,'BD')}</select>
  <div class="row" style="margin-top:14px"><button style="background:var(--ok)" onclick="doConvert('${id}')">Convert</button><button class="g" onclick="closeM()">Cancel</button></div>`,1)}
function doConvert(id){const s=val('cs');if(!s)return alert('Please enter the service');
  const l=lead(id);db.seq.cust=(db.seq.cust||0)+1;
  l.customerId='CUST-'+String(db.seq.cust).padStart(4,'0');l.stage='Converted';l.onboardedService=s;l.service=l.service||s;l.convertedBy=val('cb');l.convertedAt=new Date().toISOString();if(!l.nextFollowUp)l.nextFollowUp=addDays(7);
  db.acts.push({id:uid(),leadId:id,type:'Note',date:nowLocal(),by:l.convertedBy,notes:`Converted to customer ${l.customerId} for service: ${s}`});
  save();render();openLead(id)}

/* ---------- Customers ---------- */
function vCust(){
  const q=filt.custQ.toLowerCase();
  const C=db.leads.filter(l=>isCust(l)&&(!q||[l.company,l.customerId,l.onboardedService,l.contact].join(' ').toLowerCase().includes(q)));
  return `<div class="hd"><h2>Customers <span class="mute" style="font-size:14px">(${C.length})</span></h2></div>
  <div class="card"><label>Search</label><input data-f="custQ" value="${esc(filt.custQ)}" placeholder="Customer ID, company, service…" oninput="setF('custQ',this.value)"></div>
  <div class="card tw" style="padding:0"><table><tr><th>Customer ID</th><th>Company</th><th>Contact</th><th>Service onboarded</th><th>Executive</th><th>Converted by</th><th>Converted on</th><th>Requirements</th><th>Delivered</th><th>Next follow-up</th></tr>
  ${C.map(l=>{const rs=db.reqs.filter(r=>r.leadId===l.id),d=rs.filter(r=>r.status==='Delivered').length;
   return `<tr class="click" onclick="openLead('${l.id}')"><td><b>${esc(l.customerId)}</b></td><td>${esc(l.company)}</td><td>${esc(l.contact)}<div class="mute">${esc(l.mobile)}</div></td><td>${esc(l.onboardedService)}</td><td>${esc(uname(l.owner))}</td><td>${esc(uname(l.convertedBy))}</td><td>${fmtD(l.convertedAt)}</td><td>${rs.length}</td><td>${d}/${rs.length} <span class="mute">(${pct(d,rs.length)}%)</span></td><td class="${l.nextFollowUp&&l.nextFollowUp<today()?'late':''}">${fmtD(l.nextFollowUp)||'<span class="mute">not set</span>'}</td></tr>`}).join('')||'<tr><td colspan=10 class="empty">No customers yet. Convert a lead to create one.</td></tr>'}</table></div>`;
}

/* ---------- Requirements / ops ---------- */
const CSTAT=['Not Submitted','Submitted to Client','Interview','Onboarded','Rejected'];
const BSTAT=['Not Billed','Invoiced','Paid'];
const inr=n=>{n=Math.round(Number(n||0));return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN')};
const svcOf=r=>((r.service||(lead(r.leadId)||{}).onboardedService||'Unspecified')+'').trim()||'Unspecified';
const candsOf=id=>db.cands.filter(c=>c.reqId===id);
const candStat=id=>{const c=candsOf(id);return {total:c.length,sub:c.filter(x=>x.status!=='Not Submitted').length,iv:c.filter(x=>x.status==='Interview').length,on:c.filter(x=>x.status==='Onboarded').length,rej:c.filter(x=>x.status==='Rejected').length}};
const billed=r=>r.billStatus==='Invoiced'||r.billStatus==='Paid';
const bc=s=>({'Not Billed':'new','Invoiced':'prog','Paid':'del'}[s||'Not Billed']);
const cc=s=>({'Not Submitted':'new','Submitted to Client':'prog','Interview':'hold','Onboarded':'del','Rejected':'lost'}[s]);
const svcList=()=>[...new Set([].concat(db.leads.map(l=>l.onboardedService),db.leads.map(l=>l.service),db.reqs.map(r=>r.service)).filter(Boolean).map(s=>String(s).trim()))];
const bdTeams=()=>db.teams.filter(t=>db.users.some(u=>u.team===t&&u.role!=='Operations'));

function vOps(){
  const q=filt.opsQ.toLowerCase();
  const R=db.reqs.filter(r=>{const l=lead(r.leadId)||{};return (!filt.opsStat||r.status===filt.opsStat)&&(!filt.opsOwner||r.opsOwner===filt.opsOwner)&&(!q||[r.title,r.desc,svcOf(r),l.company,l.customerId].join(' ').toLowerCase().includes(q))}).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
  const nOps=db.users.filter(u=>u.role==='Operations').length;
  return `<div class="hd"><h2>Requirements &amp; Delivery Tracker <span class="mute" style="font-size:14px">(${R.length})</span></h2><button onclick="editReq('','')">＋ Add requirement</button></div>
  ${nOps?'':'<div class="card" style="border-color:#e0a100;background:#fff8e6">⚠ No Operations team members yet. Go to <b>Teams &amp; Executives</b>, add people with role <b>Operations</b> (with their email) so requirements can be assigned and alerted.</div>'}
  <div class="card row"><div class="f"><label>Search</label><input data-f="opsQ" value="${esc(filt.opsQ)}" placeholder="Customer, service, requirement…" oninput="setF('opsQ',this.value)"></div>
   <div class="f"><label>Delivery status</label><select onchange="setF('opsStat',this.value)">${opts(RSTAT,filt.opsStat,'All')}</select></div>
   <div class="f"><label>Operations owner</label><select onchange="setF('opsOwner',this.value)">${userOpts(filt.opsOwner,'All','OPS')}</select></div></div>
  <div class="card tw" style="padding:0"><table><tr><th>Customer</th><th>Requirement shared by client</th><th>Dates</th><th>BD Exec</th><th>Ops owner</th><th>Delivery</th><th>Profiles</th><th>Billing</th><th></th></tr>
  ${R.map(r=>{const l=lead(r.leadId)||{},cs=candStat(r.id);const lateR=r.status!=='Delivered'&&r.due&&r.due<today();
   return `<tr><td><b>${esc(l.company)}</b><div class="mute">${esc(l.customerId)}</div><div class="mute">${esc(svcOf(r))}</div></td>
   <td><b>${esc(r.title)}</b><div class="mute">${esc(r.desc)}</div>${r.remarks?`<div class="mute">Ops: ${esc(r.remarks)}</div>`:''}</td>
   <td><div class="mute">Shared ${fmtD(r.shared)}</div><div class="${lateR?'late':''}">Due ${fmtD(r.due)||'—'}</div></td>
   <td>${esc(uname(l.owner))}</td>
   <td>${esc(uname(r.opsOwner))}${r.opsOwner?(r.alertedAt?`<div class="mute" style="font-size:12px">✉ alerted ${fmtD(r.alertedAt)}</div>`:`<div class="late" style="font-size:12px">✉ not alerted</div>`):''}</td>
   <td><select style="width:130px" onchange="quickStat('${r.id}',this.value)">${opts(RSTAT,r.status)}</select></td>
   <td><b>${cs.sub}</b>${r.openings?' / '+r.openings:''} submitted<div class="mute">${cs.on} onboarded · ${cs.rej} rejected</div></td>
   <td><span class="pill ${bc(r.billStatus)}">${r.billStatus||'Not Billed'}</span><div class="mute">${r.charge?inr(r.charge):'—'}</div></td>
   <td style="white-space:nowrap"><button class="g s" onclick="editReq('${r.id}','${r.leadId}')">Edit</button> <button class="g s" onclick="candM('${r.id}')">Candidates (${cs.total})</button> ${r.opsOwner?`<button class="g s" title="Email alert to ops owner" onclick="alertM('${r.id}')">✉</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=9 class="empty">No requirements yet. Add them once a lead becomes a customer.</td></tr>'}</table></div>`;
}
function quickStat(id,s){const r=db.reqs.find(x=>x.id===id);r.status=s;r.updatedAt=new Date().toISOString();if(s==='Delivered'&&!r.deliveredOn)r.deliveredOn=today();save();render()}
function editReq(id,leadId){
  const r=id?db.reqs.find(x=>x.id===id):{leadId,shared:today(),status:'Not Started',billStatus:'Not Billed'};
  const custs=db.leads.filter(isCust);
  if(!custs.length)return alert('Requirements can be added only for customers. Convert a lead first.');
  if(!r.service&&r.leadId)r.service=(lead(r.leadId)||{}).onboardedService||'';
  modal(`<div class="hd"><h3>${id?'Edit':'Add'} requirement</h3><button class="x" onclick="closeM()">×</button></div>
  <datalist id="svcs">${svcList().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <div class="row"><div class="f" style="flex:2"><label>Customer *</label><select id="rl" onchange="const l=lead(this.value);if(l&&!val('rsv'))document.getElementById('rsv').value=l.onboardedService||''">${opts(custs.map(l=>[l.id,`${l.customerId} — ${l.company}`]),r.leadId,'Select customer')}</select></div>
   <div class="f"><label>Service</label><input id="rsv" list="svcs" value="${esc(r.service)}"></div></div>
  <div class="row" style="margin-top:8px"><div class="f" style="flex:2"><label>Requirement title / position *</label><input id="rt" value="${esc(r.title)}"></div><div class="f" style="max-width:150px"><label>Positions required</label><input id="rop" type="number" min="0" value="${esc(r.openings||'')}"></div></div>
  <div style="margin-top:8px"><label>Details shared by client</label><textarea id="rd">${esc(r.desc)}</textarea></div>
  <div class="row" style="margin-top:8px"><div class="f"><label>Shared on</label><input id="rs" type="date" value="${esc(r.shared)}"></div><div class="f"><label>Delivery due</label><input id="ru" type="date" value="${esc(r.due)}"></div>
   <div class="f"><label>Operations owner (Ops team only)</label><select id="ro">${userOpts(r.opsOwner,'Unassigned','OPS')}</select></div><div class="f"><label>Delivery status</label><select id="rst">${opts(RSTAT,r.status)}</select></div></div>
  <div style="margin-top:8px"><label>Operations remarks</label><textarea id="rr" style="min-height:48px">${esc(r.remarks)}</textarea></div>
  <div class="card" style="margin:12px 0 0;background:#fafbfd"><h3>Service charge &amp; billing</h3>
   <div class="row"><div class="f"><label>Service charge / billing value (₹)</label><input id="rch" type="number" min="0" value="${esc(r.charge||'')}"></div><div class="f"><label>Direct cost (₹)</label><input id="rco" type="number" min="0" value="${esc(r.cost||'')}"></div>
   <div class="f"><label>Billing status</label><select id="rbs">${opts(BSTAT,r.billStatus||'Not Billed')}</select></div>
   <div class="f"><label>Invoice no</label><input id="rin" value="${esc(r.invoiceNo)}"></div><div class="f"><label>Invoice date</label><input id="rid" type="date" value="${esc(r.invoiceDate)}"></div></div></div>
  <div class="row" style="margin-top:12px"><button onclick="saveReq('${id}')">Save</button><button class="g" onclick="closeM()">Cancel</button>${id?`<button class="d right" onclick="delReq('${id}')">Delete</button>`:''}</div>`);
}
function saveReq(id){if(!val('rl')||!val('rt'))return alert('Customer and title are required');
  const isNew=!id;let r=id?db.reqs.find(x=>x.id===id):{id:uid()};const oldOwner=r.opsOwner;
  Object.assign(r,{leadId:val('rl'),title:val('rt'),desc:val('rd'),service:val('rsv'),openings:Number(val('rop'))||0,shared:val('rs'),due:val('ru'),opsOwner:val('ro'),status:val('rst'),remarks:val('rr'),charge:Number(val('rch'))||0,cost:Number(val('rco'))||0,billStatus:val('rbs')||'Not Billed',invoiceNo:val('rin'),invoiceDate:val('rid'),updatedAt:new Date().toISOString()});
  if(r.status==='Delivered'&&!r.deliveredOn)r.deliveredOn=today();
  if(billed(r)&&!r.invoiceDate)r.invoiceDate=today();
  if(isNew)db.reqs.push(r);
  const ownerChanged=r.opsOwner&&(isNew||r.opsOwner!==oldOwner);
  if(ownerChanged){r.alertedAt=null;r.alertedTo=null}
  save();closeM();render();
  if(ownerChanged)alertM(r.id)}
function delReq(id){if(!confirm('Delete this requirement and its candidates?'))return;db.reqs=db.reqs.filter(r=>r.id!==id);db.cands=db.cands.filter(c=>c.reqId!==id);save();closeM();render()}

/* ----- email alert to the Operations owner (opens the default mail app) ----- */
function mailParts(r){const u=user(r.opsOwner)||{},l=lead(r.leadId)||{},bd=user(l.owner)||{};
  const lines=['Hi '+(u.name||'')+',','','A requirement has been assigned to you in the CRM.','',
   'Customer: '+(l.company||'')+' ('+(l.customerId||'')+')','Service: '+svcOf(r),'Requirement: '+r.title,'Details: '+(r.desc||'-'),
   'Positions required: '+(r.openings||'-'),'Shared on: '+fmtD(r.shared),'Delivery due: '+(fmtD(r.due)||'-'),
   'BD executive: '+(bd.name||'-')+(bd.email?' <'+bd.email+'>':''),'Client contact: '+([l.contact,l.mobile,l.email].filter(Boolean).join(' | ')||'-'),
   '','Please update the delivery status and profile submissions in the CRM.','','Thanks'];
  return {to:u.email||'',subject:'New requirement assigned: '+(l.company||'')+' - '+r.title,body:lines.join('\r\n')}}
function alertM(id){const r=db.reqs.find(x=>x.id===id);const u=user(r.opsOwner);
  if(!u)return alert('Assign an Operations owner to this requirement first.');
  if(!u.email){modal(`<div class="hd"><h3>No email address for ${esc(u.name)}</h3><button class="x" onclick="closeM()">×</button></div><p>Add ${esc(u.name)}'s email in <b>Teams &amp; Executives</b>, then use the ✉ button on the requirement to send the alert.</p><div class="row"><button onclick="closeM();go('team')">Go to Teams &amp; Executives</button><button class="g" onclick="closeM()">Later</button></div>`,1);return}
  const m=mailParts(r);
  modal(`<div class="hd"><h3>✉ Alert ${esc(u.name)} about this requirement</h3><button class="x" onclick="closeM()">×</button></div>
  <div class="mute" style="margin-bottom:8px">To: <b>${esc(u.email)}</b><br>Subject: ${esc(m.subject)}</div>
  <pre style="white-space:pre-wrap;font:inherit;background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0">${esc(m.body)}</pre>
  <p class="mute">This opens a ready-made email in your default mail app (Outlook, Gmail in browser, etc.). Press <b>Send</b> there.</p>
  <div class="row"><button onclick="sendAlert('${id}')">✉ Open email to send</button><button class="g" onclick="closeM()">Later</button></div>`,1)}
function sendAlert(id){const r=db.reqs.find(x=>x.id===id),m=mailParts(r);r.alertedAt=new Date().toISOString();r.alertedTo=r.opsOwner;save();closeM();render();
  window.location.href='mailto:'+encodeURIComponent(m.to).replace(/%40/g,'@')+'?subject='+encodeURIComponent(m.subject)+'&body='+encodeURIComponent(m.body)}

/* ----- candidate profiles for a requirement ----- */
function candM(rid){const r=db.reqs.find(x=>x.id===rid),l=lead(r.leadId)||{},cs=candStat(rid),C=candsOf(rid);
  modal(`<div class="hd"><div><h3 style="font-size:17px;margin:0">Candidate profiles — ${esc(r.title)}</h3><div class="mute">${esc(l.company)} · ${esc(l.customerId)} · ${esc(svcOf(r))}</div></div><button class="x" onclick="closeM()">×</button></div>
  <div class="row" style="margin-bottom:10px"><span class="pill">Positions required: <b>${r.openings||'—'}</b></span><span class="pill prog">Profiles submitted: <b>${cs.sub}</b></span><span class="pill hold">In interview: <b>${cs.iv}</b></span><span class="pill del">Onboarded: <b>${cs.on}</b></span><span class="pill lost">Rejected: <b>${cs.rej}</b></span></div>
  <div class="card tw" style="padding:0"><table><tr><th>Candidate</th><th>Phone</th><th>Email</th><th>Position</th><th>Profile status</th><th>Submitted on</th><th>Remarks</th><th></th></tr>
  ${C.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.position)}</td>
   <td><select style="width:160px" onchange="setCand('${c.id}','${rid}',this.value)">${opts(CSTAT,c.status)}</select></td><td>${fmtD(c.submittedOn)}</td>
   <td><input value="${esc(c.remarks)}" style="min-width:140px" onchange="setCandRem('${c.id}',this.value)"></td><td><button class="g s" onclick="delCand('${c.id}','${rid}')">✕</button></td></tr>`).join('')||'<tr><td colspan=8 class="empty">No candidates added yet.</td></tr>'}</table></div>
  <div class="card"><h3>Add candidate</h3><div class="row"><div class="f"><label>Candidate name *</label><input id="cn"></div><div class="f"><label>Phone number</label><input id="cp"></div><div class="f"><label>Email ID</label><input id="ce" type="email"></div></div>
  <div class="row" style="margin-top:8px"><div class="f"><label>Position title</label><input id="cpo" value="${esc(r.title)}"></div><div class="f"><label>Profile status</label><select id="cst">${opts(CSTAT,'Submitted to Client')}</select></div><div class="f"><label>Remarks</label><input id="crm"></div></div>
  <div style="margin-top:10px"><button onclick="addCand('${rid}')">Add candidate</button></div></div>`)}
function addCand(rid){const n=val('cn');if(!n)return alert('Candidate name is required');const st=val('cst');
  db.cands.push({id:uid(),reqId:rid,name:n,phone:val('cp'),email:val('ce'),position:val('cpo'),status:st,remarks:val('crm'),submittedOn:st==='Not Submitted'?'':today(),updatedAt:new Date().toISOString()});
  save();render();candM(rid)}
function setCand(id,rid,st){const c=db.cands.find(x=>x.id===id);c.status=st;if(st!=='Not Submitted'&&!c.submittedOn)c.submittedOn=today();c.updatedAt=new Date().toISOString();save();render();candM(rid)}
function setCandRem(id,v){db.cands.find(x=>x.id===id).remarks=v;save()}
function delCand(id,rid){if(!confirm('Remove this candidate?'))return;db.cands=db.cands.filter(c=>c.id!==id);save();render();candM(rid)}

/* ---------- Follow-ups & BD reminders ---------- */
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const CONTACT_TYPES=['Call','Email','WhatsApp','Meeting'];
function lastContact(id){const a=db.acts.filter(x=>x.leadId===id&&CONTACT_TYPES.includes(x.type)).map(x=>x.date).sort();return a.length?a[a.length-1]:''}
function daysAgo(d){if(!d)return null;return Math.round((new Date(today())-new Date(String(d).slice(0,10)))/864e5)}
function fuBuckets(team,owner){
  const t=today(),w=addDays(7);
  const L=db.leads.filter(l=>l.stage!=='Lost'&&(!owner||l.owner===owner)&&(!team||teamOf(l.owner)===team));
  const by=f=>L.filter(f).sort((a,b)=>(a.nextFollowUp||'')<(b.nextFollowUp||'')?-1:1);
  return {overdue:by(l=>l.nextFollowUp&&l.nextFollowUp<t),today:by(l=>l.nextFollowUp===t),soon:by(l=>l.nextFollowUp>t&&l.nextFollowUp<=w),later:by(l=>l.nextFollowUp>w),none:by(l=>!l.nextFollowUp)};
}
function fuBanner(){if(view==='follow')return '';const B=fuBuckets('','');const o=B.overdue.length,t=B.today.length;if(!o&&!t)return '';
  return `<div class="card row" style="border-color:#e0a100;background:#fff8e6;flex-wrap:nowrap">⏰ <div><b>${o?o+' follow-up'+(o>1?'s':'')+' overdue':''}${o&&t?' and ':''}${t?t+' due today':''}.</b> Don't miss them — contact these leads/customers now.</div><button class="s right" onclick="go('follow')">View follow-ups</button></div>`}
function updFU(){const B=fuBuckets('','');const n=B.overdue.length+B.today.length;const e=document.getElementById('fuc');if(e)e.innerHTML=n?`<span class="badge">${n}</span>`:'';document.title=(n?'('+n+') ':'')+'STANCO CRM'}
function setFU(id,v){const l=lead(id);l.nextFollowUp=v;l.remindedOn='';save();render()}
function fuTable(list,empty){
  return `<div class="tw"><table><tr><th>Company</th><th>Contact</th><th>Stage</th><th>Executive</th><th>Follow-up date</th><th>Purpose / note</th><th>Last contacted</th><th></th></tr>
  ${list.map(l=>{const lc=lastContact(l.id),da=daysAgo(lc),lt=l.nextFollowUp&&l.nextFollowUp<today();
   return `<tr class="click" onclick="openLead('${l.id}')"><td><b>${esc(l.company)}</b>${l.customerId?` <span class="pill won">${esc(l.customerId)}</span>`:''}<div class="mute">${esc(l.location)}</div></td>
   <td>${esc(l.contact)}<div class="mute">${esc(l.mobile)}${l.whatsapp&&l.whatsapp!==l.mobile?' · WA '+esc(l.whatsapp):''}</div></td><td><span class="pill ${sc(l.stage)}">${l.stage}</span></td><td>${esc(uname(l.owner))}</td>
   <td onclick="event.stopPropagation()"><input type="date" style="width:145px" class="${lt?'late':''}" value="${esc(l.nextFollowUp||'')}" onchange="setFU('${l.id}',this.value)"></td>
   <td>${esc(l.followUpNote)}</td><td class="${da!==null&&da>=14?'late':''}">${lc?fmtD(lc)+'<div class="mute">'+(da===0?'today':da+' day'+(da===1?'':'s')+' ago')+'</div>':'<span class="mute">never</span>'}</td>
   <td style="white-space:nowrap" onclick="event.stopPropagation()"><button class="g s" onclick="remindLead('${l.id}')">✉ Remind exec</button>${l.remindedOn?`<div class="mute" style="font-size:12px">reminded ${fmtD(l.remindedOn)}</div>`:''}</td></tr>`}).join('')||`<tr><td colspan=8 class="empty">${empty}</td></tr>`}</table></div>`}
function vFollow(){
  const B=fuBuckets(filt.fuTeam,filt.fuOwner);
  const execs=db.users.filter(u=>u.role!=='Operations'&&(!filt.fuTeam||u.team===filt.fuTeam)&&(!filt.fuOwner||u.id===filt.fuOwner));
  const stale=[...B.overdue,...B.today,...B.soon,...B.later,...B.none].filter(l=>{const d=daysAgo(lastContact(l.id));return d===null?daysAgo(l.createdAt)>=7:d>=14}).length;
  return `<div class="hd"><h2>Follow-ups</h2><div class="row"><div><label>Team</label><select onchange="setF('fuTeam',this.value)">${opts(bdTeams(),filt.fuTeam,'All teams')}</select></div><div><label>Executive</label><select onchange="setF('fuOwner',this.value)">${userOpts(filt.fuOwner,'All executives','BD')}</select></div></div></div>
  <div class="grid kpis"><div class="kpi"><span>Overdue</span><b style="color:${B.overdue.length?'var(--bad)':'inherit'}">${B.overdue.length}</b></div><div class="kpi"><span>Due today</span><b style="color:${B.today.length?'var(--warn)':'inherit'}">${B.today.length}</b></div>
   <div class="kpi"><span>Next 7 days</span><b>${B.soon.length}</b></div><div class="kpi"><span>No follow-up scheduled</span><b style="color:${B.none.length?'var(--warn)':'inherit'}">${B.none.length}</b></div><div class="kpi"><span>Not contacted for 14+ days</span><b>${stale}</b></div></div>
  <div class="card"><h3>Executive-wise reminders</h3><div class="tw"><table><tr><th>Executive</th><th>Email</th><th>Overdue</th><th>Due today</th><th>Next 7 days</th><th>No date set</th><th></th></tr>

  const la=db.acts.filter(a=>a.leadId===id).sort((a,b)=>a.date<b.date?1:-1)[0];
  const body=['Hi '+u.name+',','','Reminder: please follow up with this '+(l.customerId?'customer':'lead')+'.','',
   'Company: '+l.company+(l.customerId?' ('+l.customerId+')':''),'Stage: '+l.stage,'Contact: '+(l.contact||'-'),'Mobile: '+(l.mobile||'-'),'WhatsApp: '+(l.whatsapp||'-'),'Phone: '+(l.phone||'-'),'Email: '+(l.email||'-'),

function digestMail(uid2){const u=user(uid2);if(!u.email)return noEmail(u);
  const b=fuBuckets('',uid2),items=[].concat(b.overdue.map(l=>['OVERDUE',l]),b.today.map(l=>['DUE TODAY',l]));

  const ready=N.filter(r=>r.status==='Delivered');
  const g={};R.forEach(r=>{const k=svcOf(r).toLowerCase();(g[k]=g[k]||{name:svcOf(r),rs:[]}).rs.push(r)});
  const S=Object.values(g).map(x=>{const b=x.rs.filter(billed),n=x.rs.filter(r=>!billed(r)),rev=sum(b,r=>r.charge),pen=sum(n,r=>r.charge),c=sum(b,r=>r.cost),cp=sum(n,r=>r.cost);
    return {name:x.name,n:x.rs.length,del:x.rs.filter(r=>r.status==='Delivered').length,billed:b.length,pend:n.length,rev,pen,c,cp,pl:rev-c,exp:rev+pen-c-cp,m:pct(rev-c,rev)}}).sort((a,b)=>b.rev-a.rev);
  const T=S.reduce((t,s)=>({n:t.n+s.n,del:t.del+s.del,billed:t.billed+s.billed,pend:t.pend+s.pend,rev:t.rev+s.rev,pen:t.pen+s.pen,c:t.c+s.c,cp:t.cp+s.cp,pl:t.pl+s.pl,exp:t.exp+s.exp}),{n:0,del:0,billed:0,pend:0,rev:0,pen:0,c:0,cp:0,pl:0,exp:0});

  ${S.length?`<tr style="background:#fafbfd;font-weight:600"><td>Total</td><td>${T.n}</td><td>${T.del}</td><td>${T.billed}</td><td>${T.pend}</td><td>${inr(T.rev)}</td><td>${inr(T.pen)}</td><td>${inr(T.c)}</td><td class="${plc(T.pl)}">${inr(T.pl)}</td><td>${pct(T.pl,T.rev)}%</td><td>${inr(T.cp)}</td><td class="${plc(T.exp)}">${inr(T.exp)}</td></tr>`:''}</table></div>

    if(s==='Converted'){db.seq.cust++;l.customerId='CUST-'+String(db.seq.cust).padStart(4,'0');l.onboardedService=l.service;l.convertedBy=ow;l.convertedAt=new Date(Date.now()-(30-i)*864e5).toISOString();
      RT.slice(0,1+(i%3)).forEach((r,k)=>{
        const status=RSTAT[(i+k)%4],charge=(2+((i+k)%5))*75000,cost=Math.round(charge*(0.25+((i+k)%4)*0.1));
        const rq={id:uid(),leadId:l.id,title:r[0],desc:r[1],openings:r[2],service:l.service,shared:new Date(Date.now()-(25-i-k)*864e5).toISOString().slice(0,10),due:new Date(Date.now()+((i%4)*6-8+k*5)*864e5).toISOString().slice(0,10),opsOwner:k%2?o2:o1,status,remarks:k%2?'Awaiting client inputs':'On track',charge,cost,billStatus:status==='Delivered'?(i%2?'Paid':'Invoiced'):'Not Billed',invoiceNo:status==='Delivered'?'INV-'+(100+i*3+k):'',invoiceDate:status==='Delivered'?today():'',alertedAt:new Date().toISOString(),alertedTo:k%2?o2:o1};
        db.reqs.push(rq);
        const n=Math.min(6,r[2]+2);
        for(let j=0;j<n;j++){const cst=CSTAT[(j+i+k)%5];db.cands.push({id:uid(),reqId:rq.id,name:names[j%6],phone:'90000'+String(10000+j*37+i),email:names[j%6].toLowerCase().replace(' ','.')+'@mail.com',position:r[0].replace(/s$/,''),status:cst,remarks:'',submittedOn:cst==='Not Submitted'?'':today()})}
      })}
  });
  save();render()}

go('dash');
